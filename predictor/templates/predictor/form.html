<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Housing Prediction</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:700px;
            max-width:90%;
            background:#fff;
            padding:35px;
            border-radius:12px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        form p{
            margin-bottom:15px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:6px;
            color:#444;
        }

        input[type="number"],
        input[type="text"]{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#4facfe;
            box-shadow:0 0 5px rgba(79,172,254,.5);
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:6px;
            background:#4facfe;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2d8cff;
        }

        .prediction{
            margin-top:25px;
            padding:18px;
            background:#e8f5e9;
            border-left:6px solid #28a745;
            border-radius:6px;
            text-align:center;
        }

        .prediction h3{
            color:#155724;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏠 Boston Housing Price Prediction</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Predict Price
        </button>
    </form>

    {% if prediction %}
    <div class="prediction">
        <h3>
            Predicted House Price:
            <br><br>
            <strong>${{ prediction|floatformat:2 }}</strong>
        </h3>
    </div>
    {% endif %}

</div>

</body>
</html>
